name: smart_books
description: Smart Books — lectura académica con Supabase y ChatGPT Plus (macOS/iOS).
publish_to: "none"
version: 0.1.0+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1
  google_fonts: ^6.3.1
  flutter_svg: ^2.2.1
  flutter_secure_storage: ^9.2.4
  http: ^1.5.0
  crypto: ^3.0.6
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.7+1
  intl: ^0.20.2
  uuid: ^4.5.1
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  pdfrx: ^2.1.4
  pdf: ^3.11.3
  image: '>=4.1.0 <4.11.0'
  collection: ^1.19.1
  lucide_icons_flutter: ^3.1.25
  flutter_web_auth_2: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# image 4.11+ exige archive 4.5; pdf exige archive <4.1 — fijar 3.x para compilar IPA.
dependency_overrides:
  archive: 3.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Margen by Bookifi</title>
    <script>
      var segmentCount = 1;
      var current = window.location;
      current.replace(
        current.protocol + "//" + current.hostname + (current.port ? ":" + current.port : "") +
        current.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
        "/?p=/" +
        current.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
        (current.search ? "&q=" + current.search.slice(1).replace(/&/g, "~and~") : "") +
        current.hash
      );
    </script>
  </head>
  <body></body>
</html>
